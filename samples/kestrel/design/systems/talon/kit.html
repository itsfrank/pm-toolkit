<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Talon kit</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="components.css">
<style>
  .kit { padding: var(--space-6); display: grid; gap: var(--space-6); max-width: 960px; }
  .kit h3 { margin: 0 0 var(--space-2); font-size: var(--text-sm); color: var(--color-text-muted); font-weight: 600; }
  .swatches { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .swatches span { width: 96px; height: 40px; border-radius: var(--radius-sm); border: 1px solid var(--color-border); font-size: var(--text-xs); padding: var(--space-1); }
</style>
</head>
<body>
<div class="kit">
  <section><h3>Colors</h3><div class="swatches">
    <span style="background:var(--color-sidebar);color:var(--color-surface)">sidebar</span>
    <span style="background:var(--color-bg)">bg</span>
    <span style="background:var(--color-accent);color:var(--color-surface)">accent</span>
    <span style="background:var(--color-table-header)">table-header</span>
  </div></section>
  <section><h3>Buttons</h3><button class="btn primary">New dashboard</button> <button class="btn">Last 30 days</button></section>
  <section><h3>Status</h3><span class="status ok">Healthy</span> &nbsp; <span class="status warn">Volume drop</span> &nbsp; <span class="status error">Failing</span> &nbsp; <span class="status muted">Muted</span></section>
  <section><h3>Card and KPI</h3><div class="card kpi" style="width:240px"><div class="label">Events</div><div class="value">1,284,330</div></div></section>
  <section><h3>Tabs</h3><div class="tabs"><a class="active" href="#">Daily</a><a href="#">Weekly</a></div></section>
  <section><h3>Table</h3><table class="table"><thead><tr><th>Event</th><th class="num">Volume</th><th>Status</th></tr></thead>
    <tbody><tr><td class="mono">page_viewed</td><td class="num">612,400</td><td><span class="status ok">Healthy</span></td></tr></tbody></table></section>
</div>
</body>
</html>
